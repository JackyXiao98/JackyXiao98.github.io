name: Deploy site

on:
  push:
    branches:
      - gh-pages
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "tools/**"
      - "**.scss"
      - "_plugins/**"
      - "!.github/workflows/*.yml"
      - "!README.md"
      - "!specs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      # Optional: set the password of protected posts from repository secrets.
      # BLOG_CONTENT_KEY = the content key; BLOG_PASSWORD = the password to use.
      # If BLOG_CONTENT_KEY is not set, the committed key.json files are used unchanged.
      - name: Set protected-post password
        env:
          PROTECT_KEY: ${{ secrets.BLOG_CONTENT_KEY }}
          PROTECT_PASSWORD: ${{ secrets.BLOG_PASSWORD }}
        run: |
          if [ -z "$PROTECT_KEY" ]; then
            echo "BLOG_CONTENT_KEY not set; keeping committed passwords"
            exit 0
          fi
          export PROTECT_PASSWORD="${PROTECT_PASSWORD:-checkpass}"
          for f in assets/protected/*/key.json; do
            node tools/protect.mjs wrap "$f"
            echo "re-wrapped $f"
          done

      - name: Install and Build
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
